<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recovery Tracker</title>
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; }
    input, textarea, button, select { font-family: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;
    const { LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer, BarChart, Bar, Cell } = Recharts;
const SATURATION = ["Dry", "Spotty", "Wet", "Soaked"];
const SAT_COLOR = { Dry: "#4ade80", Spotty: "#facc15", Wet: "#fb923c", Soaked: "#f87171" };
const SAT_SCORE = { Dry: 0, Spotty: 1, Wet: 2, Soaked: 3 };

const today = () => new Date().toISOString().slice(0, 10);
const nowTime = () => new Date().toTimeString().slice(0, 5);

const blankEntry = () => ({
  date: today(),
  pads: [],
  activityLevel: "Light",
  workDay: true,
  exercisesDone: true,
  exerciseTime: "",
  exerciseNotes: "",
  stressLevel: 2,
  waterGlasses: 6,
  notes: "",
});

const blankPad = () => ({
  id: Date.now(),
  startTime: nowTime(),
  endTime: "",
  saturation: "Spotty",
  activity: "",
});

const calcDuration = (start, end) => {
  if (!start || !end) return null;
  const [sh, sm] = start.split(":").map(Number);
  const [eh, em] = end.split(":").map(Number);
  const mins = (eh * 60 + em) - (sh * 60 + sm);
  if (mins <= 0) return null;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
};

const Pill = ({ label, active, onClick, color }) => (
  <button onClick={onClick} style={{
    padding: "6px 14px", borderRadius: 999,
    border: active ? "none" : "1.5px solid #334155",
    background: active ? (color || "#38bdf8") : "transparent",
    color: active ? "#0f172a" : "#94a3b8",
    fontFamily: "inherit", fontSize: 13, fontWeight: 600, cursor: "pointer", transition: "all .15s",
  }}>{label}</button>
);

const Stepper = ({ value, onChange, min = 0, max = 20 }) => (
  <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
    <button onClick={() => onChange(Math.max(min, value - 1))} style={stepBtn}>−</button>
    <span style={{ fontSize: 22, fontWeight: 700, color: "#e2e8f0", minWidth: 28, textAlign: "center" }}>{value}</span>
    <button onClick={() => onChange(Math.min(max, value + 1))} style={stepBtn}>+</button>
  </div>
);
const stepBtn = {
  width: 36, height: 36, borderRadius: "50%", border: "1.5px solid #334155",
  background: "#1e293b", color: "#94a3b8", fontSize: 20, cursor: "pointer",
  display: "flex", alignItems: "center", justifyContent: "center",
};

const Stars = ({ value, onChange }) => (
  <div style={{ display: "flex", gap: 6 }}>
    {[1,2,3,4,5].map(n => (
      <button key={n} onClick={() => onChange(n)} style={{
        background: "none", border: "none", cursor: "pointer", fontSize: 22,
        opacity: n <= value ? 1 : 0.22, filter: n <= value ? "none" : "grayscale(1)",
      }}>🔥</button>
    ))}
  </div>
);

const Toggle = ({ value, onChange }) => (
  <button onClick={() => onChange(!value)} style={{
    width: 48, height: 26, borderRadius: 999, border: "none", cursor: "pointer",
    background: value ? "#38bdf8" : "#334155", position: "relative", transition: "background .2s",
  }}>
    <div style={{
      width: 20, height: 20, borderRadius: "50%", background: "#fff",
      position: "absolute", top: 3, left: value ? 25 : 3, transition: "left .2s",
    }} />
  </button>
);

const Card = ({ title, children }) => (
  <div style={{ background: "#1e293b", borderRadius: 16, padding: "18px 20px", marginBottom: 14 }}>
    {title && <p style={{ margin: "0 0 14px", fontSize: 11, fontWeight: 700, letterSpacing: 2, color: "#475569", textTransform: "uppercase" }}>{title}</p>}
    {children}
  </div>
);

const Label = ({ children }) => (
  <p style={{ margin: "0 0 8px", fontSize: 13, color: "#94a3b8", fontWeight: 500 }}>{children}</p>
);

const Row = ({ label, children }) => (
  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
    <Label>{label}</Label>
    {children}
  </div>
);

const timeInput = {
  background: "#0f172a", border: "1.5px solid #334155", borderRadius: 8,
  color: "#e2e8f0", padding: "7px 10px", fontFamily: "inherit", fontSize: 14, width: "100%", boxSizing: "border-box",
};

const textInput = {
  background: "#0f172a", border: "1.5px solid #334155", borderRadius: 8,
  color: "#e2e8f0", padding: "7px 10px", fontFamily: "inherit", fontSize: 14, width: "100%", boxSizing: "border-box",
};

const PadCard = ({ pad, index, onChange, onRemove }) => {
  const duration = calcDuration(pad.startTime, pad.endTime);
  return (
    <div style={{ background: "#0f172a", borderRadius: 12, padding: "14px 16px", marginBottom: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
        <span style={{ fontSize: 13, fontWeight: 700, color: "#475569" }}>PAD {index + 1}</span>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          {duration && <span style={{ fontSize: 12, color: "#38bdf8", fontWeight: 600 }}>⏱ {duration}</span>}
          <button onClick={onRemove} style={{ background: "none", border: "none", color: "#475569", cursor: "pointer", fontSize: 20, lineHeight: 1 }}>×</button>
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>
        <div>
          <Label>Put on</Label>
          <input type="time" value={pad.startTime} onChange={e => onChange({ ...pad, startTime: e.target.value })} style={timeInput} />
        </div>
        <div>
          <Label>Removed</Label>
          <input type="time" value={pad.endTime} onChange={e => onChange({ ...pad, endTime: e.target.value })} style={timeInput} />
        </div>
      </div>
      <Label>Saturation when removed</Label>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
        {SATURATION.map(s => (
          <Pill key={s} label={s} active={pad.saturation === s} onClick={() => onChange({ ...pad, saturation: s })} color={SAT_COLOR[s]} />
        ))}
      </div>
      <Label>Activity / notes while wearing</Label>
      <input type="text" value={pad.activity} onChange={e => onChange({ ...pad, activity: e.target.value })}
        placeholder="e.g. Desk work, walking, exercises…" style={textInput} />
    </div>
  );
};

export default function App() {
  const [view, setView] = useState("log");
  const [entry, setEntry] = useState(blankEntry());
  const [entries, setEntries] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [saved, setSaved] = useState(false);
  const [reportRange, setReportRange] = useState(14);
  const [expandedDay, setExpandedDay] = useState(null);

  const STORE_KEY = "recovery_tracker_entries";

  const loadAll = () => {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch {}
    return [];
  };

  const saveAll = (allEntries) => {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(allEntries));
      return true;
    } catch {}
    return false;
  };

  useEffect(() => {
    try {
      const all = loadAll();
      all.sort((a, b) => a.date.localeCompare(b.date));
      setEntries(all);
      const todayEntry = all.find(e => e.date === today());
      if (todayEntry) setEntry(todayEntry);
    } catch (err) {
      console.error("Load error:", err);
    }
    setLoaded(true);
  }, []);

  const save = useCallback(() => {
    try {
      const all = loadAll();
      const filtered = all.filter(e => e.date !== entry.date);
      const updated = [...filtered, entry].sort((a, b) => a.date.localeCompare(b.date));
      const ok = saveAll(updated);
      if (!ok) { alert("Save failed — storage may be full."); return; }
      setEntries(updated);
      setSaved(true);
      setTimeout(() => setSaved(false), 2000);
    } catch (err) {
      console.error("Save error:", err);
      alert("Save failed — please try again.");
    }
  }, [entry]);

  const upd = (field, val) => setEntry(e => ({ ...e, [field]: val }));
  const addPad = () => upd("pads", [...entry.pads, blankPad()]);
  const updatePad = (id, updated) => upd("pads", entry.pads.map(p => p.id === id ? updated : p));
  const removePad = (id) => upd("pads", entry.pads.filter(p => p.id !== id));
  const trendData = entries.slice(-30).map(e => {
    const avgSat = e.pads?.length
      ? e.pads.reduce((s, p) => s + SAT_SCORE[p.saturation], 0) / e.pads.length
      : 0;
    return {
      date: e.date.slice(5),
      pads: e.pads?.length || 0,
      sat: Math.round(avgSat * 10) / 10,
    };
  });

  const durationData = entries.slice(-30).map(e => {
    const durMins = (e.pads || [])
      .map(p => {
        if (!p.startTime || !p.endTime) return null;
        const [sh, sm] = p.startTime.split(":").map(Number);
        const [eh, em] = p.endTime.split(":").map(Number);
        return (eh * 60 + em) - (sh * 60 + sm);
      })
      .filter(d => d && d > 0);
    const avg = durMins.length ? Math.round(durMins.reduce((a,b)=>a+b,0)/durMins.length) : 0;
    return { date: e.date.slice(5), avgMins: avg };
  }).filter(d => d.avgMins > 0);

  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - reportRange);
  const cutStr = cutoff.toISOString().slice(0, 10);
  const inRange = entries.filter(e => e.date >= cutStr);
  const allPads = inRange.flatMap(e => e.pads || []);
  const avgPadsPerDay = inRange.length ? (allPads.length / inRange.length).toFixed(1) : "–";
  const bestDay = inRange.length ? inRange.reduce((b, e) => (e.pads?.length || 0) < (b.pads?.length || 0) ? e : b, inRange[0]) : null;
  const worstDay = inRange.length ? inRange.reduce((b, e) => (e.pads?.length || 0) > (b.pads?.length || 0) ? e : b, inRange[0]) : null;
  const avgStress = inRange.length ? (inRange.reduce((s, e) => s + e.stressLevel, 0) / inRange.length).toFixed(1) : "–";
  const exerciseDays = inRange.filter(e => e.exercisesDone).length;
  const workDays = inRange.filter(e => e.workDay).length;

  const padDurations = allPads.map(p => {
    if (!p.startTime || !p.endTime) return null;
    const [sh, sm] = p.startTime.split(":").map(Number);
    const [eh, em] = p.endTime.split(":").map(Number);
    return (eh * 60 + em) - (sh * 60 + sm);
  }).filter(d => d && d > 0);
  const avgDurMins = padDurations.length ? Math.round(padDurations.reduce((a,b)=>a+b,0)/padDurations.length) : null;
  const avgDurStr = avgDurMins ? (avgDurMins >= 60 ? `${Math.floor(avgDurMins/60)}h ${avgDurMins%60}m` : `${avgDurMins}m`) : "–";

  const satCounts = { Dry: 0, Spotty: 0, Wet: 0, Soaked: 0 };
  allPads.forEach(p => { if (p.saturation) satCounts[p.saturation]++; });

  return (
    <div style={{ fontFamily: "system-ui, sans-serif", background: "#0f172a", minHeight: "100vh", color: "#e2e8f0", maxWidth: 480, margin: "0 auto", paddingBottom: 80 }}>

      <div style={{ padding: "28px 20px 16px", borderBottom: "1px solid #1e293b" }}>
        <p style={{ margin: 0, fontSize: 11, fontWeight: 700, letterSpacing: 3, color: "#38bdf8", textTransform: "uppercase" }}>Recovery</p>
        <h1 style={{ margin: "4px 0 0", fontSize: 26, fontWeight: 400, color: "#f8fafc" }}>Recovery Tracker</h1>
      </div>

      <div style={{ display: "flex", gap: 8, padding: "14px 20px", borderBottom: "1px solid #1e293b" }}>
        {[["log","Log Day"],["trends","Trends"],["report","Report"]].map(([v,l]) => (
          <Pill key={v} label={l} active={view===v} onClick={() => setView(v)} />
        ))}
      </div>

      <div style={{ padding: "16px 20px" }}>
        {view === "log" && loaded && (
          <>
            <Card>
              <Row label="Date">
                <input type="date" value={entry.date} onChange={e => {
                  const d = e.target.value;
                  const existing = entries.find(en => en.date === d);
                  setEntry(existing || { ...blankEntry(), date: d });
                }} style={{ background: "#0f172a", border: "1.5px solid #334155", borderRadius: 8, color: "#e2e8f0", padding: "6px 10px", fontFamily: "inherit", fontSize: 14 }} />
              </Row>
              <Row label="Work day"><Toggle value={entry.workDay} onChange={v => upd("workDay", v)} /></Row>
              <Row label="Exercises done"><Toggle value={entry.exercisesDone} onChange={v => upd("exercisesDone", v)} /></Row>
              {entry.exercisesDone && (
                <div style={{ marginTop: -4, marginBottom: 4 }}>
                  <Label>Time done</Label>
                  <input type="time" value={entry.exerciseTime || ""} onChange={e => upd("exerciseTime", e.target.value)}
                    style={{ background: "#0f172a", border: "1.5px solid #334155", borderRadius: 8, color: "#e2e8f0", padding: "7px 10px", fontFamily: "inherit", fontSize: 14, marginBottom: 14, display: "block" }} />
                  <Label>Exercise notes</Label>
                  <textarea value={entry.exerciseNotes || ""} onChange={e => upd("exerciseNotes", e.target.value)}
                    placeholder="How did it go? Any leakage during or after…"
                    rows={2}
                    style={{ width: "100%", background: "#0f172a", border: "1.5px solid #334155", borderRadius: 10, color: "#e2e8f0", padding: "10px 12px", fontFamily: "inherit", fontSize: 14, resize: "vertical", boxSizing: "border-box" }} />
                </div>
              )}
            </Card>

            <Card title="Activity & Wellbeing">
              <Label>Activity level</Label>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 18 }}>
                {["Rest","Light","Moderate","Active"].map(a => (
                  <Pill key={a} label={a} active={entry.activityLevel===a} onClick={() => upd("activityLevel",a)} />
                ))}
              </div>
              <Row label="Stress level"><Stars value={entry.stressLevel} onChange={v => upd("stressLevel",v)} /></Row>
              <Row label="Water (glasses)"><Stepper value={entry.waterGlasses} onChange={v => upd("waterGlasses",v)} max={15} /></Row>
            </Card>

            <Card title={`Pads — ${entry.pads.length} today`}>
              {entry.pads.length === 0 && (
                <p style={{ color: "#475569", fontSize: 14, margin: "0 0 12px" }}>No pads logged yet</p>
              )}
              {entry.pads.map((pad, i) => (
                <PadCard key={pad.id} pad={pad} index={i}
                  onChange={updated => updatePad(pad.id, updated)}
                  onRemove={() => removePad(pad.id)} />
              ))}
              <button onClick={addPad} style={{
                width: "100%", padding: "11px", borderRadius: 10,
                border: "1.5px dashed #334155", background: "none",
                color: "#38bdf8", fontWeight: 600, cursor: "pointer",
                fontFamily: "inherit", fontSize: 14, marginTop: entry.pads.length ? 4 : 0,
              }}>+ Add pad</button>
            </Card>

            <Card title="Day Notes">
              <textarea value={entry.notes} onChange={e => upd("notes", e.target.value)}
                placeholder="Anything else worth recording…" rows={3}
                style={{ width: "100%", background: "#0f172a", border: "1.5px solid #334155", borderRadius: 10, color: "#e2e8f0", padding: "10px 12px", fontFamily: "inherit", fontSize: 14, resize: "vertical", boxSizing: "border-box" }} />
            </Card>

            <button onClick={save} style={{
              width: "100%", padding: "14px", borderRadius: 12, border: "none",
              background: saved ? "#4ade80" : "#38bdf8", color: "#0f172a",
              fontWeight: 700, fontSize: 16, cursor: "pointer", fontFamily: "inherit", transition: "background .3s",
            }}>{saved ? "✓ Saved" : "Save Day"}</button>
          </>
        )}

        {view === "trends" && (
          <>
            {entries.length < 2 ? (
              <Card><p style={{ color: "#475569", textAlign: "center", padding: "20px 0" }}>Log a few days to see trends</p></Card>
            ) : (
              <>
                <Card title="Pads per day">
                  <ResponsiveContainer width="100%" height={170}>
                    <LineChart data={trendData}>
                      <XAxis dataKey="date" tick={{ fill: "#475569", fontSize: 10 }} tickLine={false} axisLine={false} />
                      <YAxis tick={{ fill: "#475569", fontSize: 10 }} tickLine={false} axisLine={false} width={20} allowDecimals={false} />
                      <Tooltip contentStyle={{ background: "#1e293b", border: "none", borderRadius: 8, color: "#e2e8f0", fontSize: 13 }} />
                      <Line type="monotone" dataKey="pads" stroke="#38bdf8" strokeWidth={2.5} dot={{ fill: "#38bdf8", r: 3 }} activeDot={{ r: 5 }} />
                    </LineChart>
                  </ResponsiveContainer>
                </Card>

                <Card title="Average saturation level">
                  <p style={{ margin: "0 0 8px", fontSize: 11, color: "#475569" }}>0 = Dry · 1 = Spotty · 2 = Wet · 3 = Soaked</p>
                  <ResponsiveContainer width="100%" height={155}>
                    <LineChart data={trendData}>
                      <XAxis dataKey="date" tick={{ fill: "#475569", fontSize: 10 }} tickLine={false} axisLine={false} />
                      <YAxis tick={{ fill: "#475569", fontSize: 10 }} tickLine={false} axisLine={false} width={20} domain={[0,3]} />
                      <Tooltip contentStyle={{ background: "#1e293b", border: "none", borderRadius: 8, color: "#e2e8f0", fontSize: 13 }} />
                      <Line type="monotone" dataKey="sat" stroke="#fb923c" strokeWidth={2.5} dot={{ fill: "#fb923c", r: 3 }} />
                    </LineChart>
                  </ResponsiveContainer>
                </Card>

                {durationData.length > 1 && (
                  <Card title="Avg pad duration (minutes)">
                    <ResponsiveContainer width="100%" height={155}>
                      <LineChart data={durationData}>
                        <XAxis dataKey="date" tick={{ fill: "#475569", fontSize: 10 }} tickLine={false} axisLine={false} />
                        <YAxis tick={{ fill: "#475569", fontSize: 10 }} tickLine={false} axisLine={false} width={30} />
                        <Tooltip contentStyle={{ background: "#1e293b", border: "none", borderRadius: 8, color: "#e2e8f0", fontSize: 13 }} formatter={v => [`${v} min`]} />
                        <Line type="monotone" dataKey="avgMins" stroke="#a78bfa" strokeWidth={2.5} dot={{ fill: "#a78bfa", r: 3 }} />
                      </LineChart>
                    </ResponsiveContainer>
                  </Card>
                )}

                <Card title="Recent days">
                  {entries.slice(-14).reverse().map(e => {
                    const avgSat = e.pads?.length ? e.pads.reduce((s,p)=>s+SAT_SCORE[p.saturation],0)/e.pads.length : 0;
                    const color = avgSat < 0.5 ? "#4ade80" : avgSat < 1.5 ? "#facc15" : avgSat < 2.5 ? "#fb923c" : "#f87171";
                    return (
                      <div key={e.date} style={{ padding: "12px 0", borderBottom: "1px solid #0f172a" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                          <div>
                            <span style={{ fontSize: 14, color: "#e2e8f0", fontWeight: 600 }}>
                              {new Date(e.date + "T12:00:00").toLocaleDateString("en-AU", { weekday:"short", day:"numeric", month:"short" })}
                            </span>
                            <div style={{ display: "flex", gap: 8, marginTop: 3 }}>
                              {e.workDay && <span style={{ fontSize: 11, color: "#475569" }}>Work</span>}
                              {e.exercisesDone && <span style={{ fontSize: 11, color: "#475569" }}>Exercises</span>}
                              <span style={{ fontSize: 11, color: "#475569" }}>Stress {e.stressLevel}/5</span>
                            </div>
                          </div>
                          <div style={{ textAlign: "right" }}>
                            <span style={{ fontSize: 20, fontWeight: 700, color }}>{e.pads?.length || 0}</span>
                            <span style={{ fontSize: 11, color: "#475569", display: "block" }}>pads</span>
                          </div>
                        </div>
                        {(e.pads || []).map((p, i) => {
                          const dur = calcDuration(p.startTime, p.endTime);
                          return (
                            <div key={i} style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 6, paddingLeft: 4 }}>
                              <span style={{ fontSize: 11, color: "#475569" }}>#{i+1}</span>
                              <span style={{ fontSize: 11, color: SAT_COLOR[p.saturation], fontWeight: 600 }}>{p.saturation}</span>
                              {dur && <span style={{ fontSize: 11, color: "#475569" }}>{dur}</span>}
                              {p.activity && <span style={{ fontSize: 11, color: "#475569", flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.activity}</span>}
                            </div>
                          );
                        })}
                      </div>
                    );
                  })}
                </Card>
              </>
            )}
          </>
        )}
        {view === "report" && (
          <>
            <Card>
              <Label>Report period</Label>
              <div style={{ display: "flex", gap: 8 }}>
                {[7,14,30].map(d => <Pill key={d} label={`${d} days`} active={reportRange===d} onClick={() => setReportRange(d)} />)}
              </div>
            </Card>

            {inRange.length === 0 ? (
              <Card><p style={{ color: "#475569", textAlign: "center", padding: "20px 0" }}>No data in this range yet</p></Card>
            ) : (
              <>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 14 }}>
                  {[
                    ["Avg pads/day", avgPadsPerDay, "#38bdf8"],
                    ["Avg pad duration", avgDurStr, "#a78bfa"],
                    ["Days logged", inRange.length, "#94a3b8"],
                    ["Work days", workDays, "#fb923c"],
                    ["Exercise days", exerciseDays, "#4ade80"],
                    ["Avg stress", `${avgStress}/5`, "#f87171"],
                  ].map(([label, val, color]) => (
                    <div key={label} style={{ background: "#1e293b", borderRadius: 14, padding: "16px 18px" }}>
                      <p style={{ margin: "0 0 6px", fontSize: 11, color: "#475569", fontWeight: 700, textTransform: "uppercase", letterSpacing: 1 }}>{label}</p>
                      <p style={{ margin: 0, fontSize: 22, fontWeight: 700, color }}>{val}</p>
                    </div>
                  ))}
                </div>

                <Card title="Saturation breakdown">
                  <div style={{ display: "flex", gap: 8 }}>
                    {SATURATION.map(s => (
                      <div key={s} style={{ flex: 1, background: SAT_COLOR[s] + "15", borderRadius: 10, padding: "12px 8px", textAlign: "center" }}>
                        <p style={{ margin: "0 0 4px", fontSize: 18, fontWeight: 700, color: SAT_COLOR[s] }}>{satCounts[s]}</p>
                        <p style={{ margin: 0, fontSize: 10, color: SAT_COLOR[s], fontWeight: 600 }}>{s}</p>
                      </div>
                    ))}
                  </div>
                </Card>

                {bestDay && worstDay && (
                  <Card title="Best & Worst days">
                    <div style={{ display: "flex", gap: 12, marginBottom: 12 }}>
                      {[{day: bestDay, label: "BEST", color: "#4ade80"}, {day: worstDay, label: "WORST", color: "#f87171"}].map(({day, label, color}) => (
                        <button key={label} onClick={() => setExpandedDay(expandedDay === day.date + label ? null : day.date + label)}
                          style={{ flex: 1, background: color + "11", borderRadius: 10, padding: "12px 14px", border: expandedDay === day.date + label ? `1.5px solid ${color}` : "1.5px solid transparent", cursor: "pointer", textAlign: "left" }}>
                          <p style={{ margin: "0 0 4px", fontSize: 11, color, fontWeight: 700 }}>{label}</p>
                          <p style={{ margin: 0, fontSize: 13, color: "#e2e8f0" }}>{new Date(day.date + "T12:00:00").toLocaleDateString("en-AU", {day:"numeric",month:"short"})}</p>
                          <p style={{ margin: "4px 0 2px", fontSize: 22, fontWeight: 700, color }}>{day.pads?.length || 0} <span style={{fontSize:12,fontWeight:400,color:"#94a3b8"}}>pads</span></p>
                          <p style={{ margin: 0, fontSize: 11, color: "#475569" }}>{expandedDay === day.date + label ? "▲ hide detail" : "▼ tap to see why"}</p>
                        </button>
                      ))}
                    </div>
                    {[{day: bestDay, label: "BEST", color: "#4ade80"}, {day: worstDay, label: "WORST", color: "#f87171"}].map(({day, label, color}) =>
                      expandedDay === day.date + label ? (
                        <div key={label} style={{ background: "#0f172a", borderRadius: 12, padding: "14px 16px", marginBottom: 8 }}>
                          <p style={{ margin: "0 0 10px", fontSize: 11, fontWeight: 700, color, letterSpacing: 1 }}>{label} DAY — {new Date(day.date + "T12:00:00").toLocaleDateString("en-AU", {weekday:"long", day:"numeric", month:"long"})}</p>
                          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 12 }}>
                            {[
                              ["Activity", day.activityLevel || "–"],
                              ["Stress", `${day.stressLevel || "–"}/5`],
                              ["Work day", day.workDay ? "Yes" : "No"],
                              ["Exercises", day.exercisesDone ? `Yes${day.exerciseTime ? " ("+day.exerciseTime+")" : ""}` : "No"],
                              ["Water", `${day.waterGlasses || "–"} glasses`],
                              ["Pads", day.pads?.length || 0],
                            ].map(([k,v]) => (
                              <div key={k} style={{ background: "#1e293b", borderRadius: 8, padding: "8px 10px" }}>
                                <p style={{ margin: "0 0 2px", fontSize: 10, color: "#475569", fontWeight: 700, textTransform: "uppercase" }}>{k}</p>
                                <p style={{ margin: 0, fontSize: 14, color: "#e2e8f0", fontWeight: 600 }}>{v}</p>
                              </div>
                            ))}
                          </div>
                          {day.exerciseNotes && <div style={{ background: "#1e293b", borderRadius: 8, padding: "10px 12px", marginBottom: 8 }}><p style={{ margin: "0 0 4px", fontSize: 10, color: "#475569", fontWeight: 700, textTransform: "uppercase" }}>Exercise notes</p><p style={{ margin: 0, fontSize: 13, color: "#94a3b8" }}>{day.exerciseNotes}</p></div>}
                          {(day.pads || []).map((p, i) => {
                            const dur = calcDuration(p.startTime, p.endTime);
                            return (
                              <div key={i} style={{ background: "#1e293b", borderRadius: 8, padding: "10px 12px", marginBottom: 6 }}>
                                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: p.activity ? 4 : 0 }}>
                                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                                    <span style={{ fontSize: 11, color: "#475569", fontWeight: 700 }}>PAD {i+1}</span>
                                    <span style={{ padding: "2px 8px", borderRadius: 999, fontSize: 11, fontWeight: 700, background: SAT_COLOR[p.saturation] + "22", color: SAT_COLOR[p.saturation] }}>{p.saturation}</span>
                                  </div>
                                  {dur && <span style={{ fontSize: 12, color: "#38bdf8", fontWeight: 600 }}>⏱ {dur}</span>}
                                </div>
                                {p.activity && <p style={{ margin: 0, fontSize: 12, color: "#64748b" }}>{p.activity}</p>}
                              </div>
                            );
                          })}
                          {day.notes && <div style={{ background: "#1e293b", borderRadius: 8, padding: "10px 12px", marginTop: 4 }}><p style={{ margin: "0 0 4px", fontSize: 10, color: "#475569", fontWeight: 700, textTransform: "uppercase" }}>Day notes</p><p style={{ margin: 0, fontSize: 13, color: "#94a3b8" }}>{day.notes}</p></div>}
                        </div>
                      ) : null
                    )}
                  </Card>
                )}

                <Card title="Surgeon / Physio Summary">
                  <div style={{ background: "#0f172a", borderRadius: 10, padding: "14px 16px", fontSize: 13, lineHeight: 1.8, color: "#94a3b8", fontFamily: "monospace", whiteSpace: "pre-wrap" }}>
{`Report period: last ${reportRange} days (${cutStr} – ${today()})
Days logged: ${inRange.length}
──────────────────────────────────
Pad usage
  Average pads/day:     ${avgPadsPerDay}
  Average pad duration: ${avgDurStr}
  Best day:  ${bestDay ? `${bestDay.pads?.length||0} pads (${bestDay.date})` : "–"}
  Worst day: ${worstDay ? `${worstDay.pads?.length||0} pads (${worstDay.date})` : "–"}

Saturation (all pads)
  Dry:    ${satCounts.Dry}
  Spotty: ${satCounts.Spotty}
  Wet:    ${satCounts.Wet}
  Soaked: ${satCounts.Soaked}

Context
  Work days:     ${workDays} / ${inRange.length}
  Exercise days: ${exerciseDays} / ${inRange.length}
  Avg stress:    ${avgStress} / 5

Exercise notes:
${inRange.filter(e=>e.exercisesDone && e.exerciseNotes).map(e=>`  ${e.date}${e.exerciseTime ? " ("+e.exerciseTime+")" : ""}: ${e.exerciseNotes}`).join("\n")||"  None recorded"}

Day notes:
${inRange.filter(e=>e.notes).map(e=>`  ${e.date}: ${e.notes}`).join("\n")||"  None recorded"}`}
                  </div>
                  <button onClick={() => {
                    const text = `Recovery Tracker Report — last ${reportRange} days\n\nDays logged: ${inRange.length}\nAvg pads/day: ${avgPadsPerDay}\nAvg pad duration: ${avgDurStr}\nBest day: ${bestDay?.pads?.length||0} pads (${bestDay?.date})\nWorst day: ${worstDay?.pads?.length||0} pads (${worstDay?.date})\n\nSaturation: Dry ${satCounts.Dry} / Spotty ${satCounts.Spotty} / Wet ${satCounts.Wet} / Soaked ${satCounts.Soaked}\n\nWork days: ${workDays}/${inRange.length}\nExercise days: ${exerciseDays}/${inRange.length}\nAvg stress: ${avgStress}/5\n\nExercise notes:\n${inRange.filter(e=>e.exercisesDone&&e.exerciseNotes).map(e=>`${e.date}${e.exerciseTime?" ("+e.exerciseTime+")":""}: ${e.exerciseNotes}`).join("\n")||"None"}\n\nDay notes:\n${inRange.filter(e=>e.notes).map(e=>`${e.date}: ${e.notes}`).join("\n")||"None"}`;
                    navigator.clipboard.writeText(text).catch(()=>{});
                  }} style={{ marginTop: 12, width: "100%", padding: "11px", borderRadius: 10, border: "1.5px solid #334155", background: "none", color: "#38bdf8", fontWeight: 600, cursor: "pointer", fontFamily: "inherit", fontSize: 14 }}>
                    Copy to Clipboard
                  </button>
                </Card>
              </>
            )}
          </>
        )}

      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
